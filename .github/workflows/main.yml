
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build executable
        run: pyinstaller --clean --noconfirm --onefile --console --name AhanModiriat AhanModiriatBuildKit/app.py

      - name: Package application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/AhanModiriat/data | Out-Null
          Copy-Item dist/AhanModiriat.exe release/AhanModiriat/
          Set-Content -Path release/AhanModiriat/Run.bat -Value '@echo off
          cd /d "%~dp0"
          start "" AhanModiriat.exe
          '
          Compress-Archive -Path release/AhanModiriat -DestinationPath AhanModiriat-Windows.zip -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: AhanModiriat-Windows
          path: AhanModiriat-Windows.zip
          retention-days: 14
