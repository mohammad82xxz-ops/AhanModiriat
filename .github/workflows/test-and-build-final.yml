name: AhanModiriat v4 Final — Test and Windows OneDir
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade -r AhanModiriatBuildKit/requirements-build.txt
      - name: Compile
        working-directory: AhanModiriatBuildKit
        run: python -m py_compile app.py test_app.py test_features.py test_http.py test_design_system.py test_release_features.py package_source.py
      - name: Regression tests
        working-directory: AhanModiriatBuildKit
        run: python test_app.py
      - name: Accounting feature tests
        working-directory: AhanModiriatBuildKit
        run: python test_features.py
      - name: HTTP smoke tests
        working-directory: AhanModiriatBuildKit
        run: python test_http.py
      - name: UI and accessibility-token checks
        working-directory: AhanModiriatBuildKit
        run: python test_design_system.py
      - name: Final feature acceptance (XLSX, POS, SQL paging, Undo)
        working-directory: AhanModiriatBuildKit
        run: python test_release_features.py
      - name: JavaScript syntax
        working-directory: AhanModiriatBuildKit
        run: node --check static/app.js
  windows-onedir:
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade -r AhanModiriatBuildKit/requirements-build.txt
      - name: Build Windows OneDir
        working-directory: AhanModiriatBuildKit
        run: python -m PyInstaller --clean --noconfirm AhanModiriat.spec
      - name: Upload Windows folder
        uses: actions/upload-artifact@v4
        with:
          name: AhanModiriat-Windows-OneDir
          path: AhanModiriatBuildKit/dist/AhanModiriat/
          if-no-files-found: error
          retention-days: 14
  source-package:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create clean source ZIP
        working-directory: AhanModiriatBuildKit
        run: python package_source.py
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AhanModiriat-Final-Source
          path: AhanModiriatBuildKit/AhanModiriat-Final-Source.zip
          if-no-files-found: error
          retention-days: 14
