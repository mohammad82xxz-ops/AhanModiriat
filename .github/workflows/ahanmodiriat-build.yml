name: AhanModiriat smoke test and Windows build
on:
  push:
    branches: [main, "feature/**", "release/**"]
  pull_request:
  workflow_dispatch:
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        working-directory: AhanModiriatBuildKit
        run: python -m py_compile app.py test_smoke.py test_design_system.py
      - name: Isolated smoke tests
        working-directory: AhanModiriatBuildKit
        run: python test_smoke.py
        run: python test_design_system.py
  windows-onedir:
    runs-on: windows-latest
    needs: smoke-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build OneDir
        working-directory: AhanModiriatBuildKit
        run: python -m PyInstaller --clean --noconfirm AhanModiriat.spec
      - name: Upload folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: AhanModiriat-Windows-OneDir
          path: AhanModiriatBuildKit/dist/AhanModiriat/
          if-no-files-found: error
          retention-days: 14
